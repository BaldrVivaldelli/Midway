name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar, por ejemplo v0.2.0 o v0.2.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  # 1) Quality gate: workspace Rust completo (100% Rust sobre iced tras la Fase 8).
  quality:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Cargo test (workspace)
        run: cargo test --workspace

  # 2) Crea (o reutiliza) el release draft una sola vez, evitando la carrera
  #    entre los jobs de la matriz al subir assets.
  release-draft:
    needs: quality
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          CHANNEL=stable
          if [[ "$RELEASE_TAG" == *-* ]]; then
            CHANNEL=beta
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.channel.outputs.channel == 'beta' }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG ya existe; se reutiliza el draft."
          else
            PRERELEASE_FLAG=""
            if [[ "$PRERELEASE" == "true" ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "Midway $RELEASE_TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi

  # 3) Empaqueta midway-desktop con cargo-packager en la matriz Windows/Linux
  #    x86_64 (sin macOS). Este job NO toca el release: sólo produce y valida los
  #    instaladores y los deja como artefactos de workflow (staging). La
  #    publicación al draft ocurre en el job `publish`, que sólo corre si TODAS
  #    las plataformas empaquetaron con éxito. Así, un fallo de `cargo-packager`
  #    en cualquier plataforma detiene el pipeline y evita publicar artefactos
  #    parciales o corruptos (Requisito 8.6).
  build:
    needs: release-draft
    permissions:
      contents: read
    strategy:
      # Requisito 8.6: un fallo de empaquetado en cualquier plataforma debe
      # detener el pipeline de release. `fail-fast: true` cancela las patas
      # restantes de la matriz en cuanto una falla, evitando seguir gastando
      # recursos y dejando explícito que el release no puede continuar.
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            platform_key: linux-x86_64
            rust_targets: x86_64-unknown-linux-gnu
            packager_formats: appimage deb
          - runner: windows-latest
            platform_key: windows-x86_64
            rust_targets: ""
            packager_formats: nsis wix
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIDWAY_GITHUB_REPOSITORY: ${{ github.repository }}
      MIDWAY_RELEASE_CHANNEL: ${{ needs.release-draft.outputs.channel }}
      MIDWAY_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      MIDWAY_APP_IDENTIFIER: ${{ vars.MIDWAY_APP_IDENTIFIER || 'com.aatv.midway' }}
      MIDWAY_PUBLISHER: ${{ vars.MIDWAY_PUBLISHER || 'Midway' }}
      MIDWAY_HOMEPAGE: ${{ vars.MIDWAY_HOMEPAGE || format('https://github.com/{0}', github.repository) }}
      MIDWAY_PRODUCT_NAME: ${{ vars.MIDWAY_PRODUCT_NAME || 'Midway' }}
      MIDWAY_BETA_PRODUCT_NAME: ${{ vars.MIDWAY_BETA_PRODUCT_NAME || 'Midway Beta' }}
    steps:
      - uses: actions/checkout@v4

      # Node se conserva únicamente para ejecutar los scripts de release en
      # `scripts/release/*.mjs` (render de config de cargo-packager, manifiesto
      # del updater y checksums); ya no hay build de frontend Vite ni `npm ci`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Genera midway-desktop/packager.{stable,beta}.generated.json a partir de
      # [package.metadata.packager] (fuente única de verdad) aplicando los
      # overrides por canal (identifier/productName/homepage/publisher).
      - name: Generate cargo-packager config
        shell: bash
        run: node scripts/release/render-packager-config.mjs --channel "$MIDWAY_RELEASE_CHANNEL"

      # Versión pinneada literal (Requisito 11.1): sin rangos abiertos y
      # verificable de forma idéntica en midway-desktop/Cargo.toml y docs.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version =0.11.8 --locked

      # Reemplaza a la antigua GitHub Action de Tauri: compila
      # (before-packaging-command) y empaqueta midway-desktop con la config del
      # canal. `--formats` se restringe a los válidos por plataforma para no
      # invocar formatos ajenos al SO actual. Si `cargo packager` falla, el paso
      # sale con código distinto de cero y el paso siguiente reporta la
      # plataforma y detiene el pipeline (Requisito 8.6).
      - name: Package midway-desktop
        id: package
        shell: bash
        run: |
          CONFIG="midway-desktop/packager.${MIDWAY_RELEASE_CHANNEL}.generated.json"
          echo "Empaquetando canal '$MIDWAY_RELEASE_CHANNEL' con $CONFIG"
          cargo packager --release --verbose \
            --config "$CONFIG" \
            --formats ${{ matrix.packager_formats }}

      # Requisito 8.6: si el empaquetado falló, se reporta explícitamente la
      # plataforma afectada y la causa (con enlace al log del paso anterior) y se
      # aborta. Combinado con `fail-fast: true` y con que `publish`/`metadata`
      # dependen del éxito de este job, garantiza que no se publiquen artefactos
      # parciales o corruptos.
      - name: Report packaging failure
        if: ${{ failure() && steps.package.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error title=Empaquetado fallido (${{ matrix.platform_key }})::cargo-packager falló al generar los instaladores para la plataforma '${{ matrix.platform_key }}' (formatos: ${{ matrix.packager_formats }}). Se detiene el pipeline de release; no se publicarán artefactos parciales o corruptos. Revisá el log del paso 'Package midway-desktop' para la causa exacta del fallo."
          exit 1

      # cargo-packager escribe los instaladores dentro del target dir; se
      # recolectan por extensión (AppImage/deb en Linux, NSIS setup.exe / MSI en
      # Windows), excluyendo el binario crudo `midway-desktop[.exe]`.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*-setup.exe' -o \
            -name '*.msi' \
          \) -exec cp {} dist/ \;
          echo "Instaladores recolectados:"
          ls -la dist

      # Salvaguarda extra: aunque `cargo packager` haya salido con éxito, si no
      # se produjo ningún instalador para esta plataforma el release quedaría
      # incompleto/corrupto. Se detiene el pipeline en lugar de continuar
      # (Requisito 8.6).
      - name: Verify installers were produced
        shell: bash
        run: |
          count=$(find dist -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error title=Sin instaladores (${{ matrix.platform_key }})::cargo-packager terminó sin error pero no se generó ningún instalador para '${{ matrix.platform_key }}'. Se detiene el pipeline para no publicar un release incompleto o corrupto."
            exit 1
          fi
          echo "Instaladores válidos para ${{ matrix.platform_key }}: $count"

      # Staging: los instaladores se guardan como artefacto de workflow, NO se
      # suben al release todavía. El job `publish` los recoge sólo si todas las
      # plataformas de la matriz tuvieron éxito.
      - name: Stage installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform_key }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # 3b) Publica los instaladores al draft SOLO si TODAS las plataformas
  #     empaquetaron con éxito. `needs: build` exige que las dos patas de la
  #     matriz terminen bien; si cualquiera falla (o es cancelada por
  #     `fail-fast`), este job se salta y ningún instalador llega al release,
  #     evitando publicar artefactos parciales o corruptos (Requisito 8.6).
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download staged installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Verify installers are present before publishing
        shell: bash
        run: |
          mkdir -p dist
          echo "Instaladores a publicar:"
          ls -la dist
          count=$(find dist -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error title=Publicación abortada::No hay instaladores para publicar; se aborta antes de tocar el release para no dejarlo en un estado parcial."
            exit 1
          fi

      - name: Upload installers to draft release
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-setup.exe
            dist/*.msi

  # 4) Genera y adjunta metadatos del updater (latest.json / latest-beta.json)
  #    y SHA256SUMS.txt sobre los artefactos de cargo-packager subidos al draft.
  #    Depende de `publish`, de modo que los metadatos del updater sólo se
  #    generan cuando el release ya tiene el set completo de instaladores.
  metadata:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Node se conserva para ejecutar los scripts de release en
      # `scripts/release/*.mjs` (manifiesto del updater y checksums); ya no hay
      # dependencias de frontend que instalar con npm.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch release metadata from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$RELEASE_TAG" --json assets,body,isPrerelease,name,tagName > out-release.json

      - name: Download current release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          find release-assets \( -name 'latest*.json' -o -name 'SHA256SUMS.txt' \) -delete

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          CHANNEL=stable
          OUTPUT=latest.json
          if [[ "$RELEASE_TAG" == *-* ]]; then
            CHANNEL=beta
            OUTPUT=latest-beta.json
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        run: |
          node scripts/release/generate-updater-json.mjs \
            --release-json out-release.json \
            --assets-dir release-assets \
            --repo "${{ github.repository }}" \
            --channel "${{ steps.channel.outputs.channel }}" \
            --output "${{ steps.channel.outputs.output }}"

      - name: Generate checksums
        run: |
          mkdir -p out
          cp "${{ steps.channel.outputs.output }}" release-assets/
          node scripts/release/generate-checksums.mjs release-assets out/SHA256SUMS.txt

      - name: Upload metadata assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.channel.outputs.output }}" \
            out/SHA256SUMS.txt \
            --clobber
